# Generated by genproj — gitleaks configuration.
#
# The default ruleset is deliberately extended rather than replaced: it is the
# maintained detector list, and a hand-written one would rot silently.
#
# Allowlists below are NARROW and commented on purpose. An allowlist entry is a
# suppression, so it has to be visible in a diff and reviewable. Prefer adding a
# fingerprint to .gitleaksignore for a one-off false positive; reserve these
# path rules for whole classes of files that are never hand-written.
[extend]
useDefault = true

# The default ruleset matches `export KEY=secret` but not the shell indirection
# form `export KEY="${KEY:-secret}"`, which is how scripts commonly carry a
# fallback credential. Verified against gitleaks 8.30.1: the two rules below
# catch that shape and the default rules do not.
#
# They are length-partitioned so one secret produces one finding: a short
# provider-prefixed token (ghp_, AKIA, ...) is matched by the first rule, and a
# longer unprefixed or prefixed token by the entropy rule.
[[rules]]
id = "shell-default-provider-token"
description = "A short credential with a known provider prefix used as a shell default, e.g. KEY=${KEY:-ghp_<token>}"
regex = '''\$\{[A-Za-z_][A-Za-z0-9_]*:?[-=]((?:sk-|sk_|ghp_|gho_|ghs_|ghu_|github_pat_|xox[abposr]-|AKIA|ASIA|glpat-|glrt-|npm_|pypi-|AIza|SG\.|hf_|shpat_|dop_v1_|eyJ)[A-Za-z0-9_\-\.]{4,19})\}'''
secretGroup = 1
keywords = ["${"]

[[rules]]
id = "shell-default-high-entropy"
description = "A high-entropy token used as a shell default, e.g. KEY=${KEY:-<40 random characters>}"
regex = '''\$\{[A-Za-z_][A-Za-z0-9_]*:?[-=]([A-Za-z0-9_.\-]{24,})\}'''
secretGroup = 1
entropy = 3.5
keywords = ["${"]

# Placeholders are the false positives these rules actually hit: an .env example
# is expected to carry ${TOKEN:-REPLACE_ME}. Scoped to the matched secret so it
# cannot hide a finding anywhere else on the line.
[[rules.allowlists]]
description = "Placeholder conventions used in .env examples and documentation"
regexTarget = "secret"
stopwords = ["example", "placeholder", "replace", "changeme", "your_", "your-", "xxxx", "dummy", "sample", "redacted", "fake"]

# Dependency lockfiles are generated by package managers. They contain no
# hand-written secrets, and they change on every dependency bump — which makes
# them the noisiest possible place to leave the default rules pointed.
[[allowlists]]
description = "Dependency lockfiles (generated, not hand-written)"
paths = [
  '''package-lock\.json$''',
  '''npm-shrinkwrap\.json$''',
  '''yarn\.lock$''',
  '''pnpm-lock\.yaml$''',
  '''Cargo\.lock$''',
  '''poetry\.lock$''',
  '''uv\.lock$''',
  '''Pipfile\.lock$''',
  '''go\.sum$''',
]

# Vendored and minified third-party code is not ours to fix, and a finding there
# is never actionable in this repository.
[[allowlists]]
description = "Vendored and minified third-party code"
paths = ['''(^|/)vendor/''', '''\.min\.(js|css)$''']

# Test fixtures deliberately contain fake credentials. Keep this scoped to
# fixtures rather than all tests: a real key pasted into a test file is still a
# leak and must be caught.
[[allowlists]]
description = "Test fixtures that deliberately contain fake credentials"
paths = ['''(^|/)tests?/fixtures/''', '''(^|/)testdata/''']
