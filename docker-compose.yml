# Docker Compose configuration for um790-backup
# Generated by genproj (docker-container capability), then specialised for a
# batch workload.
#
# This file is a REFERENCE deployment for a single phase run by hand. The real
# schedule runs one container per phase from Dagu (`docker run --rm <img> <phase>`),
# so the mount set below is the contract both paths must satisfy - keep them in
# step. `docker compose run --rm app preflight` is the closest equivalent.
#
# No `restart:`, no ports, no healthcheck: the container runs one phase and exits.

services:
  app:
    image: ghcr.io/nickbrett1/um790-backup:latest
    container_name: um790-backup
    restart: "no"

    volumes:
      # Source data, read-only: nothing in a backup should ever write to it.
      - /srv:/srv:ro
      # State, logs and the exclude file must persist between runs, so this one
      # directory is writable and is excluded from the backup itself.
      - /srv/.um790-backup:/srv/.um790-backup
      # config + dumps phases run `docker ps/inspect/exec` on the host's daemon.
      # Without this the container has the CLI and no daemon.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Two SSH identities, read-only, never baked into the image:
      #   id_ed25519_ryzen  -> ssh as nick@nas (snapshot phase, needs sudo)
      #   id_ed25519_restic -> sftp as restic@nas (the repo transport)
      - /srv/.um790-backup/ssh:/run/ssh:ro

    environment:
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      NTFY_URL: ${NTFY_URL}
      # Share-rooted, NOT /volume1-rooted: Synology's patched internal-sftp
      # exposes share names as the root, so /volume1 resolves to nothing.
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-sftp:restic@192.168.1.2:/restic-target/um790}
      NAS_HOST: ${NAS_HOST:-192.168.1.2}
      NAS_PORT: ${NAS_PORT:-2222}
      NAS_USER: ${NAS_USER:-nick}
      # Injected by Dagu per step; used for restic tags and correlation. If it is
      # absent, preflight generates one, but then `snapshot.epoch >= backup_start`
      # compares values from different runs.
      DAG_RUN_ID: ${DAG_RUN_ID:-}
      EXCLUDES: /srv/.um790-backup/exclude.txt
